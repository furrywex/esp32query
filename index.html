<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QueryHACK Web Flasher</title>
  <!-- Надежный CDN через jsDelivr -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/esp-web-tools@10/dist/web/install-button.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #58a6ff;
      font-family: monospace;
      text-align: center;
      padding-top: 80px;
    }
    h1 { color: #3fb950; }
    p { color: #8b949e; margin-bottom: 30px; }
    button {
      background-color: #238636;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
    }
    button:hover { background-color: #2ea043; }
  </style>
</head>
<body>

  <h1>QueryHACK Web Flasher 🚀</h1>
  <p>Подключи плату ESP32 CYD по USB и нажми кнопку ниже:</p>

  <!-- Кнопка прошивки, ссылающаяся на твой манифест -->
  <esp-web-install-button manifest="manifest.json">
    <button slot="activate">ПРОШИТЬ УСТРОЙСТВО</button>
  </esp-web-install-button>

</body>
</html>
